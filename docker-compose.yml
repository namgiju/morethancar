
# 단일 진입점: 호스트에는 proxy만 노출한다. DB 볼륨 이름은 기존 설정을 유지한다.
# 로컬 개발 DB는 이 파일의 postgres 서비스(아래)뿐이다. 운영 Neon DB(.env의 DB_HOST 등)는
# docker-compose.prod.yml에서만 읽는다 — 이 파일 어디에도 ${DB_HOST}를 쓰지 않는다.
services:
  proxy:
    build: ./nginx
    image: revcc-proxy:assignment
    container_name: revcc-proxy
    ports:
      - "${REVCC_PORT:-8090}:80"
    depends_on:
      frontend:
        condition: service_healthy
      core:
        condition: service_healthy
      board:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
  # Next.js(frontend/). 서비스 이름과 포트(frontend:80)는 nginx 설정이 그대로 쓴다.
  # SSR fetch는 proxy를 거쳐 API로 간다.
  frontend:
    build: ./frontend
    image: revcc-frontend:next
    container_name: revcc-frontend
    environment:
      PORT: "80"
      REVCC_API_ORIGIN: http://proxy
      KAKAO_MAP_KEY: ${KAKAO_MAP_KEY:-}
    # GET /의 SSR은 proxy를 호출하는데, proxy는 frontend가 healthy해야 뜬다.
    # API를 부르지 않는 /login으로 검사해 순환 대기를 피한다.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/login"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
  core:
    build: ./backend
    image: revcc-core:assignment
    container_name: revcc-core
    environment:
      # 로컬은 항상 이 compose의 postgres 서비스로만 붙는다. DB_HOST(.env, Neon 운영 DB)는
      # docker-compose.prod.yml에서만 쓰이고 이 파일은 참조하지 않는다 — 운영 DB 오접속을
      # 코드 구조로 막는다(scripts/assignment-run.sh와 동일한 접속 정보).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/revcc
      POSTGRES_USER: revcc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revcc}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-revcc-local-redis}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      PASSWORD_RESET_SECRET: ${PASSWORD_RESET_SECRET:-}
      WITHDRAWAL_HMAC_SECRET: ${WITHDRAWAL_HMAC_SECRET:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:8090/password-reset}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://localhost:8090/api/auth/kakao/callback}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/vehicles"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  board:
    build: ./board-service
    image: revcc-board:assignment
    container_name: revcc-board
    environment:
      # core와 동일하게 로컬 postgres 서비스로만 붙는다(위 core 주석 참고).
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: revcc
      PGUSER: revcc
      PGPASSWORD: ${POSTGRES_PASSWORD:-revcc}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-revcc-local-redis}
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: revcc-redis
    # 세션 저장소라 인증을 요구한다. 로컬 기본값은 편의용이고 운영(prod 오버레이)은 REDIS_PASSWORD를 강제한다.
    # 비밀번호는 명령줄 인자(ps에 보임) 대신 설정 파일로 넘긴다. 영문·숫자로 만든다(예: openssl rand -hex 32).
    command: ["sh", "-c", "printf 'requirepass \"%s\"\\n' \"$$REDIS_PASSWORD\" > /tmp/redis.conf && exec redis-server /tmp/redis.conf"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-revcc-local-redis}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-revcc-local-redis}
    healthcheck:
      # redis-cli는 NOAUTH 오류에도 0으로 끝날 수 있어 PONG 응답을 직접 확인한다.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:16
    container_name: revcc-postgres
    environment:
      POSTGRES_DB: revcc
      POSTGRES_USER: revcc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revcc}
    volumes:
      - revcc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revcc -d revcc"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  # 기존 revcc-site_revcc_pg를 재사용한다. down -v는 데이터를 삭제하므로 금지.
  revcc_pg:

# 기본 네트워크를 명시적인 사용자 정의 bridge로 만들어 inspect 시연이 가능하다.
# 모든 서비스가 이 네트워크에 자동 연결되며 호스트 공개 포트는 proxy에만 있다.
networks:
  default:
    name: revcc-network
    driver: bridge
